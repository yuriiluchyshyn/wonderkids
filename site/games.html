<!doctype html>
<html lang="{{@lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{@pageTitle}}</title>
    <meta name="description" content="{{@pageDescription}}" />
    <meta name="robots" content="{{@pageRobots}}" />
    <meta name="theme-color" content="#1e0a45" />
    <link rel="canonical" href="__SITE_URL__/{{@path}}" />
    {{@alternates}}
    <!-- The same page as plain Markdown, for the assistants that read rather than render. -->
    <link rel="alternate" type="text/markdown" href="__SITE_URL__/{{@path}}index.md" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulsar Kids" />
    <meta property="og:locale" content="{{@ogLocale}}" />
    {{@ogAlternates}}
    <meta property="og:url" content="__SITE_URL__/{{@path}}" />
    <meta property="og:title" content="{{@pageTitle}}" />
    <meta property="og:description" content="{{@pageDescription}}" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- What the page is, for search engines and assistants: built with the page (`build/games.ts`). -->
    <script type="application/ld+json">
      {{@ld}}
    </script>

    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-visits-api="__API_URL__/api/health">
    <div class="sky" aria-hidden="true"><i></i><i></i></div>
    <header>
      <div class="wrap bar">
        <a class="logo" href="/{{@home}}" data-home aria-label="{{header.logoLabel}}">
          <span class="emoji" aria-hidden="true">🪐</span> Pulsar Kids
        </a>
        <div class="bar-actions">
          <a class="btn btn-parent btn-small hide-narrow" data-portal="parents" href="__PARENTS_URL__/">{{cta.parents}}</a>
          <a class="btn btn-play btn-small" data-portal="play" href="__PLAY_URL__/login">{{cta.play}}</a>
          <details class="langs">
            <summary aria-label="{{lang.label}}"><span class="emoji" aria-hidden="true">🌐</span> {{@langShort}}</summary>
            <ul>
              {{@langLinks}}
            </ul>
          </details>
        </div>
      </div>
    </header>

    <main>
      <div class="wrap games-page">
        {{@pageBody}}
      </div>
    </main>

    <footer>
      <div class="wrap">
        <p>© <span id="year">2026</span> Pulsar Kids. {{footer.tagline}}</p>
        <p>
          <a href="/{{@home}}" data-home>{{footer.home}}</a>·<a href="/{{@home}}games/">{{catalog.all}}</a>·<a href="/{{@home}}privacy/">{{footer.privacy}}</a>·<a href="/{{@home}}terms/">{{footer.terms}}</a>·<a href="mailto:{{@email}}">{{@email}}</a>
        </p>
      </div>
    </footer>

    <script type="module" src="/src/scripts/inner.ts"></script>
    <!-- Vercel Web Analytics: anonymous page views, no cookies. -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
