# The texts the API answers with — English, and what any language falls back to.
# A key is `error.<ApiError constant>` or one of `Text`'s. {0}, {1} are filled in by the code;
# in a text with such a hole an apostrophe is doubled (java.text.MessageFormat).
# The other languages: messages_uk.properties, messages_pl.properties — every file has every key (MessagesTest).

