# The service listens where the platform says (Vercel's containers: PORT, 80 in
# Dockerfile.vercel); on a developer's machine — next to the game (4321) and the site (4322).
server.port=${PORT:4323}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.application.name=pulsar-api
spring.main.banner-mode=off

# An instance wakes up for a request and sleeps when there are none: start fast,
# make what a request needs when it needs it.
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.threads.virtual.enabled=true

# The schema is src/main/resources/schema.sql, applied by SchemaService — Hibernate
# only maps it. It must not ask the database anything while starting: /api/health
# answers with the database out of reach.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# The texts the API answers with: messages.properties (English, the fallback),
# messages_uk.properties, messages_pl.properties. The language is the one the
# client names in Accept-Language (see config/LangResolver).
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# A JSON answer keeps its nulls: the clients tell `null` from a field that is not there.
spring.jackson.default-property-inclusion=always
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
# Vercel takes 4.5 MB per request; the letter form sends files in pieces below it.
server.tomcat.max-swallow-size=6MB

logging.level.root=WARN
logging.level.com.pulsarkids=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
