<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7c3aed" />
    <title>ДивоСвіт — навчальні ігри для дітей</title>
    <meta
      name="description"
      content="ДивоСвіт — навчальні ігри українською для дітей 6–10 років: математика, географія, історія, екологія. Без реклами, сліз і таймерів."
    />
    <!-- App pages are personal: out of search by default. The public login
         pages switch this to "index" themselves (see usePageMeta). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ДивоСвіт" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="ДивоСвіт — навчання, схоже на пригоду" />
    <meta
      property="og:description"
      content="Математика, географія, історія та екологія у 23 іграх українською. Дитина грає і будує власну планету, а батьки керують часом за екраном."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fullscreen, app-like behaviour when added to a phone/tablet home screen -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ДивоСвіт" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Shown until the app boots: the same little solar system the app uses
         while it loads the save, so there is one continuous loading scene. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #fdf2ff, #ede9fe);
      }
      #boot i {
        position: relative;
        width: 168px;
        height: 168px;
        display: block;
      }
      #boot b {
        position: absolute;
        border-radius: 50%;
      }
      #boot .sun {
        inset: 62px;
        background: radial-gradient(circle at 35% 30%, #fff7c2, #fbbf24 55%, #f97316);
        box-shadow: 0 0 26px 8px rgba(251, 191, 36, 0.55);
      }
      #boot .o1,
      #boot .o2 {
        border: 2px dashed rgba(124, 58, 237, 0.35);
        animation: boot-turn 2.2s linear infinite;
      }
      #boot .o1 {
        inset: 44px;
      }
      #boot .o2 {
        inset: 22px;
        animation-duration: 3.6s;
        animation-direction: reverse;
      }
      #boot .o1::after,
      #boot .o2::after {
        content: '';
        position: absolute;
        top: -9px;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        border-radius: 50%;
        background: #7c3aed;
      }
      #boot .o2::after {
        background: #ec4899;
        width: 20px;
        height: 20px;
        top: -11px;
        margin-left: -10px;
      }
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Завантаження">
        <i><b class="sun"></b><b class="o1"></b><b class="o2"></b></i>
      </div>
    </div>
    <noscript>Щоб грати в ДивоСвіт, увімкніть JavaScript у браузері.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
