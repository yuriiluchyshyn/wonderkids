<!-- Pulsar Kids: a ringed "wonder planet" — the app's own mark, not any one theme's mascot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#sky)"/>
  <!-- the far half of the ring, behind the planet -->
  <ellipse cx="50" cy="54" rx="40" ry="11" fill="none" stroke="#f0abfc" stroke-width="6" transform="rotate(-18 50 54)"/>
  <circle cx="50" cy="54" r="24" fill="url(#planet)"/>
  <!-- the near half of the ring, in front -->
  <path d="M 10 54 A 40 11 0 0 0 90 54" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round" transform="rotate(-18 50 54)"/>
  <path d="M 78 12 l 3 7.5 l 7.5 3 l -7.5 3 l -3 7.5 l -3 -7.5 l -7.5 -3 l 7.5 -3 z" fill="#ffffff"/>
  <circle cx="20" cy="22" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="86" cy="84" r="2.2" fill="#ffffff" opacity="0.8"/>
</svg>
